name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release?'
        type: boolean
        default: true
      release_tag:
        description: 'Custom tag name for manual release (optional)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.30.5" "build-tools;35.0.0" "platforms;android-35"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Release APK not found at $APK_SOURCE"
            exit 1
          fi
          
          COMMIT_HASH=$(git rev-parse --short HEAD)
          APK_NAME="DmC-DevilMayCry-Android-${COMMIT_HASH}.apk"
          cp "$APK_SOURCE" "$APK_NAME"
          cp "$APK_SOURCE" "DmC-DevilMayCry-Android-latest.apk"
          
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DmC-DevilMayCry-Android-APK
          path: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            DmC-DevilMayCry-Android-latest.apk
          retention-days: 14

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
            IS_PRERELEASE="false"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
            IS_PRERELEASE="false"
          else
            TAG="continuous-${{ steps.prepare_apk.outputs.commit_hash }}"
            IS_PRERELEASE="true"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: DmC: Devil May Cry Android (${{ steps.release_tag.outputs.tag }})
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            DmC-DevilMayCry-Android-latest.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release_tag.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
