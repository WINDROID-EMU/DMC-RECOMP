plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capcom.dmc'
    compileSdk 35

    sourceSets {
        main.java.srcDirs += ["$rootDir/../sdk/thirdparty/sdl3/android-project/app/src/main/java"]
    }

    defaultConfig {
        applicationId 'com.capcom.dmc'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++23'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/*.so']
        }
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.30.5'
        }
    }

    ndkVersion '28.2.13676358'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
